<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMNT Hangman - Badges</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap');

        body {
            font-family: 'Irish Grover', cursive;
            background-color: white;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: clamp(10px, 2vw, 20px);
            width: 95vw;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo img {
            max-width: 500px;
            width: 90%;
            height: auto;
        }

        .title {
            text-align: center;
            font-size: clamp(36px, 6vw, 60px);
            margin-bottom: clamp(20px, 3vh, 40px);
            color: #000;
        }

        .badges-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: clamp(15px, 3vw, 30px);
            padding: clamp(10px, 2vw, 20px);
            margin-bottom: 80px;
        }

        .badge-item {
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1;
            overflow: hidden;
            position: relative;
        }

        .badge-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .badge-lock {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 10;
        }

        #phaser-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            display: none;
        }

        .back-button {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 40px;
            font-size: clamp(18px, 2.5vw, 24px);
            font-weight: bold;
            background-color: #00ff00;
            color: #000;
            border: 3px solid #000;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            font-family: 'Irish Grover', cursive;
            white-space: nowrap;
            transition: all 0.3s ease;
            z-index: 20;
        }

        .back-button:hover {
            background-color: #00cc00;
            transform: translateX(-50%) scale(1.05);
        }

        /* Responsive Media Queries */
        @media (max-width: 768px) {
            .logo img {
                max-width: 350px;
            }

            .badges-grid {
                gap: clamp(10px, 2vw, 20px);
                margin-bottom: 100px;
            }

            .back-button {
                bottom: 20px;
                padding: 10px 30px;
            }
        }

        @media (max-width: 480px) {
            .badges-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .logo img {
                max-width: 280px;
            }

            .back-button {
                bottom: 15px;
                padding: 8px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="tmntlogo.png" alt="TMNT Hangman Logo">
        </div>

        <div class="title">BADGES</div>

        <div class="badges-grid">
            <div class="badge-item">
                <img src="images/badges/katana.png" alt="Katana">
                <img src="images/badges/lock.png" class="badge-lock" id="katana-lock" alt="Locked">
            </div>
            <div class="badge-item">
                <img src="images/badges/turtle badge.png" alt="Turtle Badge">
                <img src="images/badges/lock.png" class="badge-lock" alt="Locked">
            </div>
            <div class="badge-item">
                <img src="images/badges/leatherhead.png" alt="Leatherhead">
                <img src="images/badges/lock.png" class="badge-lock" alt="Locked">
            </div>
            <div class="badge-item">
                <img src="images/badges/regular shredder.png" alt="Regular Shredder">
                <img src="images/badges/lock.png" class="badge-lock" id="shredder-lock" alt="Locked">
            </div>
            <div class="badge-item">
                <img src="images/badges/super shredder.png" alt="Super Shredder">
                <img src="images/badges/lock.png" class="badge-lock" alt="Locked">
            </div>
            <div class="badge-item">
                <img src="images/badges/technodrome.png" alt="Technodrome">
                <img src="images/badges/lock.png" class="badge-lock" alt="Locked">
            </div>
            <div class="badge-item">
                <img src="images/badges/krang.png" alt="Krang">
                <img src="images/badges/lock.png" class="badge-lock" alt="Locked">
            </div>
            <div class="badge-item">
                <img src="images/badges/mutagen.png" alt="Mutagen">
                <img src="images/badges/lock.png" class="badge-lock" alt="Locked">
            </div>
            <div class="badge-item">
                <img src="images/badges/channel 6.png" alt="Channel 6">
                <img src="images/badges/lock.png" class="badge-lock" alt="Locked">
            </div>
            <div class="badge-item">
                <img src="images/badges/van.png" alt="Van">
                <img src="images/badges/lock.png" class="badge-lock" alt="Locked">
            </div>
            <div class="badge-item">
                <img src="images/badges/Gemini_Generated_Image_iem71miem71miem7.png" alt="Badge 11">
                <img src="images/badges/lock.png" class="badge-lock" alt="Locked">
            </div>
            <div class="badge-item">
                <img src="images/badges/manholecover.png" alt="Manhole Cover">
                <img src="images/badges/lock.png" class="badge-lock" alt="Locked">
            </div>
            <div class="badge-item">
                <img src="images/badges/bepoprocksteady.png" alt="Badge 13">
                <img src="images/badges/lock.png" class="badge-lock" alt="Locked">
            </div>
            <div class="badge-item">
                <img src="images/badges/Gemini_Generated_Image_z4wekhz4wekhz4we.png" alt="Badge 14">
                <img src="images/badges/lock.png" class="badge-lock" alt="Locked">
            </div>
            <div class="badge-item">
                <img src="images/badges/blimp.png" alt="Badge 15">
                <img src="images/badges/lock.png" class="badge-lock" alt="Locked">
            </div>
            <div class="badge-item">
                <img src="images/badges/footclan.png" alt="Foot Clan">
                <img src="images/badges/lock.png" class="badge-lock" alt="Locked">
            </div>
            <div class="badge-item">
                <img src="images/badges/Gemini_Generated_Image_jq3odmjq3odmjq3o.png" alt="Badge 17">
                <img src="images/badges/lock.png" class="badge-lock" alt="Locked">
            </div>
            <div class="badge-item">
                <img src="images/badges/ratking.png" alt="Rat King">
                <img src="images/badges/lock.png" class="badge-lock" id="ratking-lock" alt="Locked">
            </div>
        </div>

        <a href="./index.html" class="back-button">Back to Menu</a>
    </div>

    <div id="phaser-animation"></div>

    <script>
        // Check if level 5 has been completed and show animation or unlock badge
        const level5Completed = localStorage.getItem('tmnt_level5_persistent') === 'true';
        const animationShown = localStorage.getItem('katana_animation_shown') === 'true';

        console.log('Level 5 completed:', level5Completed);
        console.log('Animation already shown:', animationShown);

        if (level5Completed && !animationShown) {
            console.log('Playing unlock animation...');
            // Play animation for first time
            playUnlockAnimation();
        } else if (level5Completed) {
            console.log('Badge already unlocked, skipping animation');
            // Just unlock the badge (animation already shown)
            const katanaLock = document.getElementById('katana-lock');
            if (katanaLock) {
                katanaLock.style.display = 'none';
            }
        } else {
            console.log('Level 5 not completed yet');
        }

        // Check if level 6 has been completed and unlock regular shredder badge
        const level6Completed = localStorage.getItem('tmnt_level6_persistent') === 'true';
        console.log('Level 6 completed:', level6Completed);

        if (level6Completed) {
            const shredderLock = document.getElementById('shredder-lock');
            if (shredderLock) {
                shredderLock.style.display = 'none';
                console.log('Regular Shredder badge unlocked');
            }
        }

        // Check if level 9 has been completed and unlock rat king badge
        const level9Completed = localStorage.getItem('tmnt_level9_persistent') === 'true';
        console.log('Level 9 completed:', level9Completed);

        if (level9Completed) {
            const ratkingLock = document.getElementById('ratking-lock');
            if (ratkingLock) {
                ratkingLock.style.display = 'none';
                console.log('Rat King badge unlocked');
            }
        }

        function playUnlockAnimation() {
            const animationContainer = document.getElementById('phaser-animation');
            animationContainer.style.display = 'block';

            const config = {
                type: Phaser.AUTO,
                width: 800,
                height: 600,
                parent: 'phaser-animation',
                transparent: true,
                physics: {
                    default: 'arcade',
                    arcade: {
                        gravity: { y: 300 }
                    }
                },
                scene: {
                    preload: preload,
                    create: create
                }
            };

            const game = new Phaser.Game(config);

            function preload() {
                this.load.image('lock', 'images/badges/lock.png');
                this.load.image('sword', 'images/badges/katana.png');
                this.load.image('badge', 'images/badges/katana.png');
            }

            function create() {
                const scene = this;

                // Create lock in center
                const lock = this.add.image(400, 300, 'lock').setScale(0.8);

                // Create sword off-screen
                const sword = this.add.image(-100, 250, 'sword').setScale(0.6).setAngle(-45);

                // Sword slash animation
                this.tweens.add({
                    targets: sword,
                    x: 900,
                    y: 350,
                    duration: 500,
                    ease: 'Power2',
                    onComplete: function() {
                        // Shake the lock
                        scene.tweens.add({
                            targets: lock,
                            angle: -10,
                            duration: 50,
                            yoyo: true,
                            repeat: 3,
                            onComplete: function() {
                                // Create explosion particles
                                const particles = scene.add.particles(400, 300, 'lock', {
                                    speed: { min: 100, max: 300 },
                                    scale: { start: 0.3, end: 0 },
                                    lifespan: 1000,
                                    gravityY: 200,
                                    quantity: 30,
                                    blendMode: 'ADD'
                                });

                                particles.explode();

                                // Hide lock and sword
                                lock.destroy();
                                sword.destroy();

                                // Show badge and fade in
                                const badge = scene.add.image(400, 300, 'badge').setScale(0.5).setAlpha(0);
                                scene.tweens.add({
                                    targets: badge,
                                    alpha: 1,
                                    scale: 0.7,
                                    duration: 1000,
                                    ease: 'Power2',
                                    delay: 500,
                                    onComplete: function() {
                                        // Fade out entire animation
                                        scene.tweens.add({
                                            targets: [badge, animationContainer],
                                            alpha: 0,
                                            duration: 1000,
                                            delay: 1000,
                                            onComplete: function() {
                                                // Clean up
                                                animationContainer.style.display = 'none';
                                                game.destroy(true);

                                                // Remove lock from actual badge
                                                const katanaLock = document.getElementById('katana-lock');
                                                if (katanaLock) {
                                                    katanaLock.style.display = 'none';
                                                }

                                                // Mark animation as shown
                                                localStorage.setItem('katana_animation_shown', 'true');
                                            }
                                        });
                                    }
                                });
                            }
                        });
                    }
                });
            }
        }
    </script>
</body>
</html>
