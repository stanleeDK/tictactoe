<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMNT Hangman Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap');

        body {
            font-family: 'Irish Grover', cursive;
            background-color: white;
            margin: 0;
            padding: 0;
            height: 100vh;
        }

        .container {
            background: white;
            padding: clamp(10px, 2vw, 20px);
            width: 95vw;
            max-width: 1200px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .logo {
            margin-bottom: 10px;
        }

        .content {
            display: flex;
            gap: clamp(20px, 3vw, 40px);
            align-items: center;
            flex: 1;
            overflow: hidden;
        }

        .left-side {
            flex-shrink: 0;
            position: relative;
            max-width: 45%;
        }

        .left-side img.footprint {
            width: 100%;
            height: auto;
            max-width: 450px;
        }

        .right-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .word-lines {
            display: flex;
            gap: clamp(6px, 1vw, 12px);
            margin-bottom: clamp(20px, 3vh, 30px);
            justify-content: center;
            flex-wrap: wrap;
        }

        .letter-input {
            width: clamp(40px, 5vw, 60px);
            height: 4px;
            background: repeating-linear-gradient(
                90deg,
                black 0px,
                black 2px,
                transparent 2px,
                transparent 3px,
                black 3px,
                black 5px,
                transparent 5px,
                transparent 6px
            );
            position: relative;
        }

        .letter-input input {
            position: absolute;
            top: clamp(-30px, -3.5vw, -35px);
            left: 0;
            width: 100%;
            border: none;
            background: transparent;
            font-size: clamp(24px, 3vw, 32px);
            font-weight: bold;
            text-align: center;
            outline: none;
            text-transform: uppercase;
            font-family: 'Irish Grover', cursive;
        }

        .level-info {
            margin-top: clamp(40px, 8vh, 80px);
            text-align: center;
        }

        .level-info h2 {
            font-size: clamp(24px, 3.5vw, 36px);
            margin-bottom: 10px;
        }

        .level-info p {
            font-size: clamp(22px, 3vw, 32px);
        }

        .clue-container {
            margin-bottom: clamp(20px, 4vh, 40px);
            text-align: center;
        }

        .clue-label {
            font-size: clamp(20px, 2.5vw, 28px);
            font-weight: bold;
            margin-bottom: 5px;
        }

        .clue-caption {
            font-size: clamp(16px, 2vw, 20px);
            color: #666;
            font-style: italic;
        }

/* NEW - container for all cover pieces */
.cover-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

/* NEW - styling for each white cover piece */
.cover-piece {
    position: absolute;
    background-color: white;
    cursor: pointer;
    pointer-events: auto;
    transition: opacity 0.3s ease;
}

/* NEW - when clicked, piece fades away */
.cover-piece.revealed {
    opacity: 0;
    pointer-events: none;
}

/* NEW - defines 6 pieces covering different parts */
.piece-1 { top: 0; left: 0; width: 50%; height: 33%; }
.piece-2 { top: 0; left: 50%; width: 50%; height: 33%; }
.piece-3 { top: 33%; left: 0; width: 50%; height: 34%; }
.piece-4 { top: 33%; left: 50%; width: 50%; height: 34%; }
.piece-5 { top: 67%; left: 0; width: 50%; height: 33%; }
.piece-6 { top: 67%; left: 50%; width: 50%; height: 33%; }

.success-message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1000;
    font-size: clamp(32px, 6vw, 72px);
    font-weight: bold;
    color: transparent;
    -webkit-text-stroke: 3px #4caf50;
    text-stroke: 3px #4caf50;
    text-align: center;
    animation: flash 0.5s infinite alternate;
    display: none;
    padding: clamp(20px, 4vw, 40px);
    background: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
    max-width: 90vw;
}

.success-message.show {
    display: block;
}

@keyframes flash {
    0% {
        -webkit-text-stroke: 3px #4caf50;
        text-stroke: 3px #4caf50;
    }
    100% {
        -webkit-text-stroke: 3px #ff9800;
        text-stroke: 3px #ff9800;
    }
}
/* AFTER: */
.confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    background-color: #f0f;
    top: -20px;  /* NEW - starts confetti above screen */
    z-index: 999;  /* NEW - ensures confetti is visible */
    animation: confetti-fall 3s linear forwards;
}

@keyframes confetti-fall {
    to {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
    }
}

.missile {
    position: fixed;
    width: 150px;
    height: 150px;
    background-image: url('finalmissile Background Removed.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    z-index: 999;
    filter: drop-shadow(0 0 15px rgba(255, 69, 0, 0.6));
}

.explosion {
    position: fixed;
    width: 100px;
    height: 100px;
    z-index: 998;
    animation: explode 1.2s ease-out forwards;
}

@keyframes explode {
    0% {
        transform: scale(0);
        opacity: 1;
    }
    30% {
        transform: scale(2);
        opacity: 1;
    }
    60% {
        transform: scale(3);
        opacity: 0.7;
    }
    100% {
        transform: scale(4);
        opacity: 0;
    }
}

.explosion-particle {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
}

.explosion-particle:nth-child(1) {
    background: radial-gradient(circle, #ff4500 0%, #ff0000 30%, transparent 70%);
    box-shadow: 0 0 100px #ff4500;
}

.explosion-particle:nth-child(2) {
    background: radial-gradient(circle, #ff6347 0%, #ff4500 30%, transparent 70%);
    animation-delay: 0.05s;
    box-shadow: 0 0 80px #ff6347;
}

.explosion-particle:nth-child(3) {
    background: radial-gradient(circle, #ffa500 0%, #ff8c00 30%, transparent 70%);
    animation-delay: 0.1s;
    box-shadow: 0 0 60px #ffa500;
}

.explosion-particle:nth-child(4) {
    background: radial-gradient(circle, #ffff00 0%, #ffa500 30%, transparent 70%);
    animation-delay: 0.15s;
    box-shadow: 0 0 40px #ffff00;
}

.smoke {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(50, 50, 50, 0.8) 0%, rgba(80, 80, 80, 0.4) 40%, transparent 70%);
    animation: smoke-rise 2s ease-out forwards;
}

@keyframes smoke-rise {
    0% {
        transform: scale(0) translateY(0);
        opacity: 0.8;
    }
    50% {
        opacity: 0.6;
    }
    100% {
        transform: scale(3) translateY(-300px);
        opacity: 0;
    }
}

/* Responsive Media Queries */
@media (max-width: 768px) {
    .content {
        flex-direction: column;
        gap: 20px;
    }

    .left-side {
        max-width: 60%;
    }

    .left-side img.footprint {
        max-width: 300px;
    }

    .right-side {
        width: 100%;
    }

    .logo img {
        max-width: 80%;
    }
}

@media (max-width: 1024px) {
    .left-side {
        max-width: 40%;
    }

    .left-side img.footprint {
        max-width: 350px;
    }
}

@media (max-width: 1280px) {
    .container {
        width: 98vw;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="tmntlogo.png" alt="TMNT Hangman Logo">
        </div>

        <div class="content">
            <div class="left-side">
                <img class="footprint" src="shredder.png" alt="Tempestra">
                <!-- NEW - added cover overlay with 6 clickable pieces -->
                <div class="cover-overlay">
                    <div class="cover-piece piece-1"></div>
                    <div class="cover-piece piece-2"></div>
                    <div class="cover-piece piece-3"></div>
                    <div class="cover-piece piece-4"></div>
                    <div class="cover-piece piece-5"></div>
                    <div class="cover-piece piece-6"></div>
                </div>
            </div>

            <div class="right-side">
                <div>
                    <div class="clue-container">
                        <div class="clue-label">Where is tempestra from?</div>
                        <div class="clue-caption">Clue</div>
                    </div>
                    <div class="word-lines">
                        <div class="letter-input"><input type="text" maxlength="1"></div>
                        <div class="letter-input"><input type="text" maxlength="1"></div>
                        <div class="letter-input"><input type="text" maxlength="1"></div>
                        <div class="letter-input"><input type="text" maxlength="1"></div>
                        <div class="letter-input"><input type="text" maxlength="1"></div>
                        <div class="letter-input"><input type="text" maxlength="1"></div>
                    </div>

                    <div class="level-info">
                        <h2>Level 10</h2>
                        <p>Tempestra</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="success-message" id="successMessage">
        COWABUNGA!<br>YOU GOT IT RIGHT!
    </div>
    <div class="success-message" id="gameOverMessage" style="-webkit-text-stroke: 3px #ff0000; text-stroke: 3px #ff0000;">
        GAME OVER!!
    </div>

    <script>
        const correctAnswer = 'ARCADE';
        let wrongGuesses = 0;
        const maxWrongGuesses = 6;

        const inputs = document.querySelectorAll('.letter-input input');
        const coverPieces = document.querySelectorAll('.cover-piece');

        inputs.forEach((input, index) => {
            input.addEventListener('input', function(e) {
                const value = e.target.value.toUpperCase();
                e.target.value = value;

                if (value) {
                    if (value !== correctAnswer[index]) {
                        if (wrongGuesses < maxWrongGuesses) {
                            coverPieces[wrongGuesses].classList.add('revealed');
                            wrongGuesses++;

                            if (wrongGuesses >= maxWrongGuesses) {
                                document.getElementById('gameOverMessage').classList.add('show');
                                createMissiles();
                                setTimeout(() => {
                                    window.location.href = "./index.html";
                                }, 3500);
                            } else {
                                // Move to next input even if wrong
                                if (index < inputs.length - 1) {
                                    inputs[index + 1].focus();
                                }
                            }
                        }
                    } else {
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        } else {
                            // Validate the entire answer before showing success
                            const userAnswer = Array.from(inputs).map(input => input.value.toUpperCase()).join('');
                            if (userAnswer === correctAnswer) {
                                document.getElementById('successMessage').classList.add('show');
                                createConfetti();
                                localStorage.setItem('level10Completed', 'true');
                                localStorage.setItem('tmnt_level10_persistent', 'true');
                                setTimeout(() => {
                                    window.location.href = "./index.html";
                                }, 3000);
                            }
                        }
                    }
                }
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        inputs[0].focus();


function createConfetti() {
    const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffa500', '#ff1493'];
    const confettiCount = 1000;

    for (let i = 0; i < confettiCount; i++) {
        setTimeout(() => {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDelay = Math.random() * 0.5 + 's';
            confetti.style.width = (Math.random() * 10 + 5) + 'px';
            confetti.style.height = (Math.random() * 10 + 5) + 'px';
            document.body.appendChild(confetti);

            setTimeout(() => confetti.remove(), 3000);
        }, i * 30);
    }
}

function createMissiles() {
    const missileCount = 15;

    for (let i = 0; i < missileCount; i++) {
        setTimeout(() => {
            const missile = document.createElement('div');
            missile.className = 'missile';

            // Random starting position from edges
            const side = Math.floor(Math.random() * 4);
            let startX, startY, endX, endY;

            switch(side) {
                case 0: // top
                    startX = Math.random() * window.innerWidth;
                    startY = -50;
                    break;
                case 1: // right
                    startX = window.innerWidth + 50;
                    startY = Math.random() * window.innerHeight;
                    break;
                case 2: // bottom
                    startX = Math.random() * window.innerWidth;
                    startY = window.innerHeight + 50;
                    break;
                case 3: // left
                    startX = -50;
                    startY = Math.random() * window.innerHeight;
                    break;
            }

            // Random explosion point on screen
            endX = Math.random() * window.innerWidth;
            endY = Math.random() * window.innerHeight;

            missile.style.left = startX + 'px';
            missile.style.top = startY + 'px';

            // Calculate angle for rotation
            // Add 90 degrees because the missile image points upward (0deg = up)
            // but atan2 assumes 0deg = right
            const angle = Math.atan2(endY - startY, endX - startX) * 180 / Math.PI + 90;
            missile.style.transform = `rotate(${angle}deg)`;

            document.body.appendChild(missile);

            // Animate missile
            const duration = 800 + Math.random() * 400;
            missile.animate([
                { left: startX + 'px', top: startY + 'px' },
                { left: endX + 'px', top: endY + 'px' }
            ], {
                duration: duration,
                easing: 'linear'
            });

            // Create explosion when missile reaches target
            setTimeout(() => {
                missile.remove();
                createExplosion(endX, endY);
            }, duration);

        }, i * 200);
    }
}

function createExplosion(x, y) {
    const explosion = document.createElement('div');
    explosion.className = 'explosion';
    explosion.style.left = (x - 50) + 'px';
    explosion.style.top = (y - 50) + 'px';

    // Create multiple particles for layered explosion effect
    for (let i = 0; i < 4; i++) {
        const particle = document.createElement('div');
        particle.className = 'explosion-particle';
        explosion.appendChild(particle);
    }

    document.body.appendChild(explosion);

    // Create smoke clouds
    for (let i = 0; i < 8; i++) {
        setTimeout(() => {
            const smoke = document.createElement('div');
            smoke.className = 'smoke';
            const smokeSize = 150 + Math.random() * 200;
            smoke.style.width = smokeSize + 'px';
            smoke.style.height = smokeSize + 'px';
            smoke.style.left = (x - smokeSize/2 + (Math.random() - 0.5) * 200) + 'px';
            smoke.style.top = (y - smokeSize/2 + (Math.random() - 0.5) * 200) + 'px';
            smoke.style.animationDelay = (Math.random() * 0.3) + 's';
            document.body.appendChild(smoke);

            setTimeout(() => smoke.remove(), 2000);
        }, i * 100);
    }

    setTimeout(() => explosion.remove(), 1200);
}
    </script>
</body>
</html>
