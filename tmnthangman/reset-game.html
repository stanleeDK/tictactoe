<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset TMNT Hangman</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap');
        
        body {
            font-family: 'Irish Grover', cursive;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
        }
        
        h1 {
            color: #00ff00;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }
        
        p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #333;
        }
        
        button {
            padding: 15px 40px;
            font-size: 24px;
            font-family: 'Irish Grover', cursive;
            font-weight: bold;
            background-color: #ff0000;
            color: white;
            border: 3px solid #000;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background-color: #cc0000;
            transform: scale(1.05);
        }
        
        .back-button {
            background-color: #9E9E9E;
            color: #000;
        }
        
        .back-button:hover {
            background-color: #BDBDBD;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            display: none;
        }
        
        .status.success {
            background-color: #4CAF50;
            color: white;
            display: block;
        }
        
        .info {
            background-color: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reset Game Progress</h1>
        <p>Click the button below to reset all level completions and start fresh.</p>
        
        <button onclick="resetProgress()">Reset All Progress</button>
        <button class="back-button" onclick="goBack()">Back to Game</button>
        
        <div class="status" id="status">
            ✓ Game progress has been reset!
        </div>
        
        <div class="info">
            This will clear all completed levels and hide the "Play Extra Games" button. You'll need to complete the levels again.
        </div>
    </div>

    <script>
        function resetProgress() {
            // Clear all level completion flags (temporary and persistent)
            for (let i = 1; i <= 50; i++) {
                localStorage.removeItem(`level${i}Completed`);
                localStorage.removeItem(`tmnt_level${i}_persistent`);
            }
            
            // Show success message
            document.getElementById('status').classList.add('success');
            
            // Automatically redirect after 2 seconds
            setTimeout(() => {
                window.location.href = './index.html';
            }, 2000);
        }
        
        function goBack() {
            window.location.href = './index.html';
        }
    </script>
</body>
</html>
